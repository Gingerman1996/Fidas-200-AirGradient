; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	!echo '-D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D AG_LOG_LEVEL=AG_LOG_LEVEL_INFO -D GIT_VERSION=\"'$(git describe --tags --always --dirty)'\"'
	-D DISABLE_OTA
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
	sensirion/Sensirion I2C STCC4@^1.0.0
	sensirion/Sensirion Core@^0.7.0
	aglib=symlink://../Fidas-200-AirGradient
	EEPROM
	WebServer
	ESDNS
	FS
	SPIFFS
	HTTPClient
	WiFiClientSecure
	Update
	DNSServer
	

